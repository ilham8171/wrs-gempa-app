name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/full-earthquake-categories, feature/weather-gps-complete]
# Keep only the newest APK build for each branch; stale pushes do not waste runner time.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK and enforce 500 MB maximum
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE_BYTES="$(stat -c '%s' "$APK")"
          MAX_BYTES=$((500 * 1024 * 1024))
          echo "APK size: $((SIZE_BYTES / 1024 / 1024)) MiB"
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "APK exceeds the 500 MiB limit."
            exit 1
          fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: wrs-gempa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
